title: "AI Infosec Landing"
description: "Daily AI, Security & Compliance Practical Intelligence — 中英双语实用技术情报"
baseurl: "/ai-infosec-landing"
url: "https://KyleSKing.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
theme: null  # custom theme

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Collections
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from build
exclude:
  - scripts/
  - "*.py"
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github/

# SEO
lang: "zh-CN"
timezone: Asia/Shanghai
