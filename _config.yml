title: "東情局 · DONG INTEL BUREAU"
description: "Weekly AI, Security & Compliance Practical Intelligence — 中英双语实用技术情报"
baseurl: "/ai-infosec-landing"
url: "https://KyleSKing.github.io"
author: "東情局 / DONG INTEL BUREAU"

# Build settings
markdown: kramdown
highlighter: rouge
theme: null  # custom theme

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from build
exclude:
  - scripts/
  - "*.py"
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github/

# SEO
lang: "zh-CN"
timezone: Asia/Shanghai

# Supabase — anon key gets injected at build time by CI.
# Do NOT commit a real key here; placeholder is replaced by sed in the workflow.
supabase:
  url: "https://placeholder.supabase.co"
  anon_key: "SUPABASE_ANON_KEY_PLACEHOLDER"

# Twitter / OG defaults consumed by jekyll-seo-tag
twitter:
  username: "dongintbureau"
  card: "summary_large_image"
logo: /assets/img/avatar.jpg
default_image: /assets/img/og-default.png
