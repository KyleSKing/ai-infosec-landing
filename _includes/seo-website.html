<!-- _includes/seo-website.html — WebSite JSON-LD for the homepage. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "alternateName": "DONG INTEL BUREAU",
  "url": {{ site.url | append: site.baseurl | jsonify }},
  "description": {{ site.description | jsonify }},
  "inLanguage": ["zh-CN", "en"],
  "publisher": {
    "@type": "Organization",
    "name": "東情局",
    "logo": {
      "@type": "ImageObject",
      "url": {{ site.url | append: site.baseurl | append: '/assets/img/avatar.jpg' | jsonify }}
    }
  }
}
</script>

{%- assign og_image = site.url | append: site.baseurl | append: '/assets/img/og-default.png' -%}
<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="{{ og_image }}">
<meta name="twitter:card" content="summary_large_image">
