name: Daily Article Publisher

on:
  schedule:
    - cron: '0 16 * * 0'  # 每周日UTC 16:00（北京时间周一00:00）
  workflow_dispatch:       # 允许手动触发

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests python-dateutil python-frontmatter

      - name: Generate articles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/generate.py

      - name: Update article archive index
        run: python3 scripts/update_archive.py

      - name: Set up Ruby and Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install Ruby dependencies
        run: bundle install

      - name: Commit generated article to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/ archive/
          if git diff --cached --quiet; then
            echo "No generated article or archive changes to commit."
          else
            git commit -m "chore: publish daily article + update archive"
            git push origin HEAD:main
          fi

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          # Optionally, you can enable force_orphan if needed
          # force_orphan: true
