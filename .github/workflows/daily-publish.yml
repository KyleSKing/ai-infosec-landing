name: Weekly Article Publisher

on:
  schedule:
    - cron: '0 16 * * 0'  # 每周日UTC 16:00（北京时间周一00:00）
  workflow_dispatch:       # 允许手动触发

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests python-dateutil python-frontmatter

      - name: Restore generated content from content branch
        run: |
          mkdir -p _posts archive
          if git ls-remote --exit-code --heads origin content >/dev/null 2>&1; then
            git fetch origin content
            git checkout origin/content -- _posts archive || true
          elif compgen -G "_posts/*.md" >/dev/null; then
            echo "No content branch found. Using source-branch posts for initial seed."
          else
            echo "::error::No content branch or source posts found. Seed the content branch before source-only release."
            exit 1
          fi

      - name: Generate articles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/generate.py

      - name: Sync stats from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            python3 scripts/sync_stats.py || echo "stats sync failed; continuing with empty scaffold"
          else
            echo "Supabase secrets not set; writing empty stats scaffold."
            python3 scripts/sync_stats.py
          fi

      - name: Inject Supabase anon key into build
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_URL" ]; then
            sed -i "s|SUPABASE_ANON_KEY_PLACEHOLDER|$SUPABASE_ANON_KEY|g" _config.yml
            sed -i "s|https://placeholder.supabase.co|$SUPABASE_URL|g" _config.yml
            echo "✅ Injected Supabase config into _config.yml"
          else
            echo "Supabase secrets not set; anon key remains placeholder (Supabase features disabled)."
          fi

      - name: Update article archive index
        run: python3 scripts/update_archive.py

      - name: Set up Ruby and Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install Ruby dependencies
        run: bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site

      - name: Upload generated content artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-content-${{ github.run_id }}
          path: |
            _posts/
            archive/
          retention-days: 30

      - name: Save generated content to content branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          worktree_dir="$(mktemp -d)"
          git worktree add --detach "$worktree_dir"

          if git ls-remote --exit-code --heads origin content >/dev/null 2>&1; then
            git -C "$worktree_dir" fetch origin content
            git -C "$worktree_dir" checkout -B content origin/content
          else
            git -C "$worktree_dir" checkout --orphan content
            git -C "$worktree_dir" rm -rf . >/dev/null 2>&1 || true
          fi

          rm -rf "$worktree_dir/_posts" "$worktree_dir/archive"
          mkdir -p "$worktree_dir/_posts" "$worktree_dir/archive"
          cp -a _posts/. "$worktree_dir/_posts/"
          cp -a archive/. "$worktree_dir/archive/"

          git -C "$worktree_dir" add _posts archive
          if git -C "$worktree_dir" diff --cached --quiet; then
            echo "No generated content changes to save."
          else
            git -C "$worktree_dir" commit -m "chore: save generated content"
            git -C "$worktree_dir" push origin content
          fi

          git worktree remove "$worktree_dir"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          # Optionally, you can enable force_orphan if needed
          # force_orphan: true
